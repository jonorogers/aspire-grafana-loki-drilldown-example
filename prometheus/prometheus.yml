storage:
  tsdb:
    out_of_order_time_window: 30m

otlp:

scrape_configs:
  - job_name: "rabbitmq-server"
    static_configs:
      - targets:
          - eventbus:15692

  - job_name: "rabbitmq-server-detailed"
    metrics_path: "/metrics/detailed"
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets:
          - eventbus:15692
